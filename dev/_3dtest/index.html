<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>3D 内核迁移验证</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#10130f}#view{width:100%;height:100%}</style>
</head>
<body>
<div id="view"></div>
<script src="./bundle-probe.js"></script>
<script>
/* 迁移验证页：只用打包产物，不碰游戏本体。
   目的：确认 src/app/3d/ 的内核在 IIFE 形态下能渲染 + 能走动 + 无报错。 */
(function () {
  var log = [];
  window.__errors = log;
  window.addEventListener('error', function (e) { log.push('error: ' + (e.message || e)); });

  var s3;
  try {
    s3 = window.Scene3D.createGame3D({
      container: document.getElementById('view'),
      data: window.Scene3D.gamedata,
      onBuild: function (i) { (window.__builds = window.__builds || []).push(i); },
      onFocus: function (h) { window.__focus = h ? (h.kind + ':' + h.label) : null; },
      onInteract: function (h) {
        window.__interacted = window.__interacted || [];
        window.__interacted.push(h.kind + ':' + h.label);
      },
      onError: function (e) { log.push('onError: ' + e.message); },
    });
  } catch (e) {
    log.push('createGame3D 抛错: ' + e.message);
  }

  window.__s3 = s3;
  window.__load = function (id) { return !!s3.loadLocation(id); };
  /* 必须显式 start()：loadLocation 只构建场景，主循环由 start 驱动。 */
  if (s3) { s3.loadLocation('slum'); s3.start(); }
  window.__ready = !!s3;
})();
</script>
</body>
</html>
