name: quality-gate

on:
  push:
    branches: [main, master, dev]
  pull_request:

# 阶段1 质量门禁：lint + typecheck + 事件完整性 + 核心单测
# 策略（增量采纳）：legacy src/js 的 ESLint 为 warn 级，不阻断现有优化循环；
# typecheck(src/app, strict) 与事件完整性 / 单测必须 0 失败。
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 用 install 而非 ci：本仓库 package-lock 因本地代理未起暂未含 eslint，
      # CI 网络可正常拉取；待本地代理恢复后建议改回 npm ci 并 regenerate lock。
      - name: Install deps
        run: npm install

      - name: ESLint (legacy src/js, warn-level)
        run: npm run lint

      - name: TypeScript typecheck (src/app, strict)
        run: npm run typecheck

      - name: Event integrity + smoke
        run: npm test

      # 可复现性门禁：同种子跑两次必须逐字节一致。
      # 背景：2026-09-15 之前本项目 MC 跑分不可复现 —— checkNewsConduit 把
      # 「已检查」标记写回共享新闻池 NEWS_L1_L4 的对象上，跨局残留使下一局跳过
      # 新闻传导链、少消耗随机数、PRNG 错位，同种子两局全盘分叉。
      # 这一步用最小规模（2 局 × 200 天）守住底线：一旦再出现跨局状态残留，
      # 两次输出立刻分叉，CI 直接红。
      - name: Reproducibility gate (MC baseline self-check)
        run: node scripts/run-baseline.cjs --trials 2 --days 200 --seed 20260915 --check-only

      - name: Unit tests (core logic)
        run: npm run test:unit
