# ──────────────────────────────────────────────────────────────────────────────
# 全系统优化循环 · 状态提示
#
# 用途：读取 .claude/loop-domain-state.json，把上一轮/下一轮方向显示在
#       Actions 的 Summary 里，作为「该开新轮了」的提示入口。
#
# 触发：本工作流**只做状态展示**，不修改仓库、不提交、不推送。
#       真正的优化代码需要 Claude Code CLI 来写，故保留 workflow_dispatch
#       供手动查看；同时挂上 push 触发器，使每次推送都顺带校验本文件
#       仍然可解析、可运行（避免像 2026-07-25 ~ 09-16 那样长期静默损坏）。
#
# [历史] 2026-07-25 引入时以 `run: |` 内联 Python，顶格行 `import json`
#        提前终止了 YAML 块标量，导致文件解析失败、jobs:0、每次 push
#        都产生一条 0 秒红色 ❌。且原脚本引用的 currentRound/currentDomain
#        等字段在状态文件中并不存在，运行时亦必然崩溃（双重损坏）。
#        2026-09-16 抽出为 .claude/scripts/read-loop-state.py 并修复。
# ──────────────────────────────────────────────────────────────────────────────
name: 🔁 Loop Optimization · 全系统优化

on:
  workflow_dispatch:           # 手动触发（推荐）
  push:
    branches: [main]           # 顺带校验本文件健康度

# 纯只读工作流，仅需读取仓库内容
permissions:
  contents: read

jobs:
  notify-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Read loop state
        run: |
          python3 .claude/scripts/read-loop-state.py

      - name: Summary
        run: |
          echo "## 🔁 全系统优化循环已就绪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "点击此 workflow run 即可通知 Claude Code 执行下一轮优化。" >> $GITHUB_STEP_SUMMARY
          echo "**下一步**: 运行 `/loop` 或再次触发此 action。" >> $GITHUB_STEP_SUMMARY
