<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 首页 - 房子图标 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6bbf7c"/>
      <stop offset="100%" stop-color="#4a9e5c"/>
    </linearGradient>
  </defs>
  <!-- 屋顶 -->
  <polygon points="50,12 12,42 22,42 22,78 78,78 78,42 88,42" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 门 -->
  <rect x="42" y="56" width="16" height="22" rx="3" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <!-- 窗户 -->
  <rect x="36" y="46" width="8" height="8" rx="1.5" fill="url(#g)" opacity="0.5"/>
  <rect x="56" y="46" width="8" height="8" rx="1.5" fill="url(#g)" opacity="0.4"/>
</svg>