  </defs>
  <!-- 奖杯体 -->
  <path d="M30,18 L30,50 Q30,64 50,64 Q70,64 70,50 L70,18 Z" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
