  <path d="M70,22 Q84,22 84,36 Q84,48 70,48" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <!-- 底座 -->
  <rect x="38" y="64" width="24" height="8" rx="2" fill="url(#g)" opacity="0.6"/>
  <rect x="34" y="72" width="32" height="6" rx="2" fill="url(#g)" opacity="0.4"/>
