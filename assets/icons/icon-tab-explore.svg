<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 探索 - 地图/指南针 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6bbf7c"/>
      <stop offset="100%" stop-color="#4a9e5c"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#g)" stroke-width="5"/>
  <!-- 十字线 -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="14" y1="50" x2="86" y2="50" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <!-- 指南针三角 -->
  <polygon points="50,32 34,68 50,58 66,68" fill="url(#g)"/>
  <!-- 定位点 -->
  <circle cx="50" cy="50" r="5" fill="#fff" stroke="url(#g)" stroke-width="2.5"/>
</svg>