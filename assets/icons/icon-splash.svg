<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6bbf7c"/>
      <stop offset="100%" stop-color="#4a9e5c"/>
    </linearGradient>
  </defs>
  <rect width="750" height="1334" fill="url(#sky)"/>

  <!-- 星光 -->
  <circle cx="120" cy="200" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="150" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="580" cy="180" r="2.5" fill="#fff" opacity="0.5"/>
  <circle cx="650" cy="300" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="200" cy="350" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="500" cy="130" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="680" cy="100" r="1.8" fill="#fff" opacity="0.35"/>
  <circle cx="400" cy="280" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="90" cy="420" r="1.5" fill="#fff" opacity="0.4"/>

  <!-- 月亮 -->
  <circle cx="560" cy="300" r="45" fill="#fef3c7" opacity="0.9"/>
  <circle cx="575" cy="290" r="38" fill="#1a1a2e" opacity="0.25"/>

  <!-- 城市天际线 -->
  <!-- 后排 -->
  <rect x="0" y="620" width="750" height="714" fill="#1a202c"/>
  <rect x="30" y="540" width="55" height="200" fill="#2d3748" rx="3"/>
  <rect x="100" y="500" width="40" height="240" fill="#2d3748" rx="3"/>
  <rect x="155" y="560" width="50" height="180" fill="#2d3748" rx="3"/>
  <rect x="220" y="490" width="45" height="250" fill="#2d3748" rx="3"/>
  <rect x="280" y="550" width="60" height="190" fill="#2d3748" rx="3"/>
  <rect x="355" y="520" width="50" height="220" fill="#2d3748" rx="3"/>
  <rect x="420" y="480" width="55" height="260" fill="#2d3748" rx="3"/>
  <rect x="490" y="530" width="45" height="210" fill="#2d3748" rx="3"/>
  <rect x="550" y="510" width="55" height="230" fill="#2d3748" rx="3"/>
  <rect x="620" y="550" width="50" height="190" fill="#2d3748" rx="3"/>
  <rect x="685" y="520" width="55" height="220" fill="#2d3748" rx="3"/>

  <!-- 中排（品牌绿建筑） -->
  <rect x="170" y="470" width="65" height="270" fill="#4a9e5c" rx="4" opacity="0.75"/>
  <rect x="310" y="430" width="75" height="310" fill="#4a9e5c" rx="4" opacity="0.65"/>
  <!-- 绿建筑窗户 -->
  <rect x="180" y="490" width="10" height="8" fill="#fff" opacity="0.5" rx="1.5"/>
  <rect x="200" y="490" width="10" height="8" fill="#fff" opacity="0.7" rx="1.5"/>
  <rect x="215" y="490" width="10" height="8" fill="#fff" opacity="0.4" rx="1.5"/>
  <rect x="180" y="520" width="10" height="8" fill="#fff" opacity="0.4" rx="1.5"/>
  <rect x="200" y="520" width="10" height="8" fill="#fff" opacity="0.6" rx="1.5"/>
  <rect x="215" y="520" width="10" height="8" fill="#fff" opacity="0.5" rx="1.5"/>
  <rect x="180" y="550" width="10" height="8" fill="#fff" opacity="0.5" rx="1.5"/>
  <rect x="200" y="550" width="10" height="8" fill="#fff" opacity="0.3" rx="1.5"/>
  <rect x="215" y="550" width="10" height="8" fill="#fff" opacity="0.5" rx="1.5"/>

  <!-- 地标高楼（中央） -->
  <rect x="440" y="440" width="80" height="300" fill="#4a9e5c" rx="4" opacity="0.85"/>
  <rect x="455" y="460" width="12" height="10" fill="#fff" opacity="0.6" rx="2"/>
  <rect x="475" y="460" width="12" height="10" fill="#fff" opacity="0.8" rx="2"/>
  <rect x="493" y="460" width="12" height="10" fill="#fff" opacity="0.5" rx="2"/>
  <rect x="455" y="490" width="12" height="10" fill="#fff" opacity="0.5" rx="2"/>
  <rect x="475" y="490" width="12" height="10" fill="#fff" opacity="0.7" rx="2"/>
  <rect x="493" y="490" width="12" height="10" fill="#fff" opacity="0.5" rx="2"/>
  <rect x="455" y="520" width="12" height="10" fill="#fff" opacity="0.4" rx="2"/>
  <rect x="475" y="520" width="12" height="10" fill="#fff" opacity="0.6" rx="2"/>
  <rect x="493" y="520" width="12" height="10" fill="#fff" opacity="0.4" rx="2"/>
  <rect x="455" y="550" width="12" height="10" fill="#fff" opacity="0.5" rx="2"/>
  <rect x="475" y="550" width="12" height="10" fill="#fff" opacity="0.3" rx="2"/>
  <rect x="493" y="550" width="12" height="10" fill="#fff" opacity="0.5" rx="2"/>
  <rect x="455" y="580" width="12" height="10" fill="#fff" opacity="0.4" rx="2"/>
  <rect x="475" y="580" width="12" height="10" fill="#fff" opacity="0.6" rx="2"/>
  <rect x="493" y="580" width="12" height="10" fill="#fff" opacity="0.4" rx="2"/>

  <!-- 品牌副楼（右侧） -->
  <rect x="560" y="490" width="60" height="250" fill="#4a9e5c" rx="4" opacity="0.6"/>

  <!-- 桥 -->
  <rect x="190" y="600" width="100" height="6" fill="#6bbf7c" rx="3" opacity="0.5"/>
  <rect x="530" y="600" width="100" height="6" fill="#6bbf7c" rx="3" opacity="0.5"/>

  <!-- 人物剪影 - 背对城市 -->
  <g transform="translate(375, 560)">
    <circle cx="0" cy="-18" r="12" fill="#fff" opacity="0.7"/>
    <rect x="-8" y="-6" width="16" height="24" rx="5" fill="#fff" opacity="0.6"/>
    <rect x="-6" y="18" width="6" height="14" rx="3" fill="#fff" opacity="0.5"/>
    <rect x="1" y="18" width="6" height="14" rx="3" fill="#fff" opacity="0.5"/>
  </g>

  <!-- 底部渐变遮罩 -->
  <rect x="0" y="740" width="750" height="594" fill="url(#accent)" opacity="0.08"/>

  <!-- Logo 文字区域 -->
  <text x="375" y="700" font-family="sans-serif" font-size="44" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="8">城市浮生记</text>
  <text x="375" y="730" font-family="sans-serif" font-size="16" fill="#6bbf7c" text-anchor="middle" letter-spacing="4" opacity="0.7">City Life Story</text>

  <!-- 底部装饰点 -->
  <circle cx="375" cy="810" r="4" fill="#4a9e5c" opacity="0.5"/>

  <!-- 加载动画点 -->
  <circle cx="360" cy="810" r="3" fill="#6bbf7c" opacity="0.3"/>
  <circle cx="390" cy="810" r="3" fill="#6bbf7c" opacity="0.3"/>
</svg>