<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>城市浮生记 · 3D 原型｜全量地点</title>
<style>
  :root{
    --ink:#d6d3c8; --ink-dim:#8e9089; --line:rgba(214,211,200,.16);
    --acc:#d8b45a; --acc-dim:rgba(216,180,90,.22);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#10130f;
    font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  #view{display:block;width:100%;height:100%}

  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%, transparent 54%, rgba(9,12,14,.52) 100%)}
  .tone{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
    background:linear-gradient(180deg, rgba(150,166,172,.10) 0%, rgba(92,102,96,.15) 100%)}

  .hud{position:fixed;inset:0;pointer-events:none;padding:16px 18px;
    display:flex;flex-direction:column;justify-content:space-between;
    font-size:12.5px;line-height:1.6}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .pane{background:rgba(16,19,17,.66);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:10px;padding:9px 13px}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
  .sub{color:var(--ink-dim);font-size:11.5px;margin-top:3px;max-width:46ch}
  .badge{display:inline-block;margin-top:6px;font-size:10.5px;padding:1.5px 7px;border-radius:99px;
    background:var(--acc-dim);color:var(--acc);border:1px solid rgba(216,180,90,.3)}
  kbd{display:inline-block;min-width:19px;text-align:center;padding:1px 5px;margin-right:3px;
    font:inherit;font-size:11px;background:rgba(214,211,200,.1);
    border:1px solid var(--line);border-radius:4px;color:var(--ink)}
  .keys{display:flex;flex-direction:column;gap:3px;color:var(--ink-dim)}
  .keys b{color:var(--ink);font-weight:500}
  .stat{text-align:right;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b{color:var(--ink);font-weight:500}
  #flavor{max-width:52ch;color:#c3c0b4;font-style:italic;margin-top:6px;font-size:12px;line-height:1.7}

  /* 交互提示 */
  #prompt{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);
    background:rgba(16,19,17,.82);border:1px solid rgba(216,180,90,.45);border-radius:99px;
    padding:7px 18px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;
    box-shadow:0 6px 26px rgba(0,0,0,.5);white-space:nowrap}
  #prompt.on{opacity:1;transform:translate(-50%,0)}

  /* 交互面板 */
  #panel{position:fixed;right:18px;bottom:18px;width:340px;max-height:70vh;overflow:auto;
    background:rgba(16,19,17,.9);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;
    box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #panel.on{opacity:1;transform:none;pointer-events:auto}
  #panel .close{position:absolute;right:10px;top:8px;background:none;border:none;color:var(--ink-dim);
    font-size:19px;cursor:pointer;line-height:1;padding:4px 6px}
  #panel .close:hover{color:var(--ink)}
  .p-head{display:flex;gap:11px;align-items:center;margin-bottom:10px}
  .p-icon{font-size:26px;line-height:1}
  .p-head h3{margin:0;font-size:15px;font-weight:600}
  .p-sub{font-size:11px;color:var(--ink-dim);margin-top:2px}
  .p-desc{font-size:12.5px;line-height:1.75;color:#c3c0b4;margin:0 0 12px}
  .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
  .p-grid > div{background:rgba(214,211,200,.05);border-radius:7px;padding:7px 9px}
  .p-grid dt{font-size:10.5px;color:var(--ink-dim);margin-bottom:2px}
  .p-grid dd{margin:0;font-size:12.5px;font-weight:500}
  .p-grid dd.hl{color:var(--acc)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px !important}
  .p-note{font-size:10.5px;color:var(--ink-dim);line-height:1.6;
    border-top:1px solid var(--line);padding-top:9px}
  .p-note code{background:rgba(214,211,200,.08);padding:1px 4px;border-radius:3px;font-size:10px}

  /* 地点列表 */
  #loc-list{position:fixed;left:18px;top:50%;transform:translate(-14px,-50%) scale(.98);
    width:308px;max-height:78vh;overflow:auto;
    background:rgba(16,19,17,.92);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:12px;padding:12px;
    opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:6}
  #loc-list.on{opacity:1;transform:translate(0,-50%) scale(1);pointer-events:auto}
  #loc-search{width:100%;background:rgba(214,211,200,.07);border:1px solid var(--line);
    border-radius:7px;padding:7px 10px;color:var(--ink);font:inherit;font-size:12px;outline:none;margin-bottom:10px}
  #loc-search:focus{border-color:rgba(216,180,90,.45)}
  .g{margin-bottom:11px}
  .g-title{font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em;margin-bottom:5px;
    display:flex;justify-content:space-between;padding:0 2px}
  .g-items{display:flex;flex-direction:column;gap:2px}
  .loc{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink);
    font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;cursor:pointer;text-align:left;width:100%}
  .loc:hover{background:rgba(214,211,200,.08)}
  .loc.on{background:var(--acc-dim);box-shadow:inset 0 0 0 1px rgba(216,180,90,.35)}
  .loc .i{width:19px;text-align:center;font-size:13px}
  .loc .n{flex:1}
  .loc .t{color:var(--acc);font-size:8px;letter-spacing:1px}
  .loc .j{color:var(--ink-dim);font-size:10px;font-variant-numeric:tabular-nums}
  .empty{color:var(--ink-dim);font-size:12px;padding:14px 4px;text-align:center}
  #loc-list::-webkit-scrollbar{width:6px}
  #loc-list::-webkit-scrollbar-thumb{background:rgba(214,211,200,.18);border-radius:3px}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#10130f;color:var(--ink-dim);font-size:13px;z-index:9}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="vignette"></div>
<div class="tone"></div>

<div class="hud">
  <div class="row">
    <div class="pane">
      <h1 id="loc-name">—</h1>
      <div class="sub" id="loc-desc"></div>
      <div class="badge" id="badge">—</div>
      <div id="flavor"></div>
    </div>
    <div class="pane stat">
      <div><b id="fps">— FPS</b></div>
      <div id="pos">x — z —</div>
    </div>
  </div>
  <div class="row">
    <div class="pane keys">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <b>移动</b> · <kbd>Shift</kbd> <b>跑</b></div>
      <div><kbd>E</kbd> <b>交互</b> · <kbd>Tab</kbd> <b>地点列表</b> · 滚轮 <b>缩放</b></div>
    </div>
    <div class="pane keys" style="text-align:right">
      <div><b>29 个地点 · 5 种布局 · 3 档质感</b></div>
      <div>全部由真实游戏数据驱动生成</div>
    </div>
  </div>
</div>

<div id="prompt"></div>
<div id="panel"></div>

<aside id="loc-list">
  <input id="loc-search" placeholder="搜索地点 / 类型…" autocomplete="off">
  <div id="loc-items"></div>
</aside>

<div id="loading">正在载入游戏数据…</div>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
  // 地点列表容器在 main.js 里按分组渲染，这里只做一次挂载校验
  import './src/main.js';
</script>
</body>
</html>
