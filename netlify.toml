# ── Netlify 部署配置 ───────────────────────────────────────────────────────────
#
#   本项目不走 Netlify CI/CD（GitHub webhook 被 strict contributor verification
#   拦截）。部署流程为本地构建 + `netlify deploy` 直接推送：
#
#     npm run deploy   →  python build.py → dist/index.html
#                      →  verify:deploy（校验产物）
#                      →  netlify deploy --dir=dist --prod（直推 CDN）
#
#   此文件保留供 `netlify deploy` CLI 读取配置，不再用于 CI 自动构建。

[build]
  command = "npm run build:legacy"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
